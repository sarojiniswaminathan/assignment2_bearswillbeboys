<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bears Will Be Boys: Animal Gender Scale (Semantic Zoom)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --axis-color: #1e293b;
      --even-border: #f59e0b;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    header {
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      color: #334155;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #e2e8f0;
    }

    .zoom-level-badge {
      font-size: 12.5px;
      font-weight: 600;
      color: #475569;
      background: #f8fafc;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }

    .zoom-instruction {
      font-size: 12.5px;
      color: #b45309;
      background: #fef3c7;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #chart-wrapper {
      position: relative;
      margin-top: 16px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: #ffffff;
      overflow: hidden;
      cursor: grab;
    }

    #chart-wrapper:active {
      cursor: grabbing;
    }

    svg {
      display: block;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      visibility: hidden;
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 8px;
      padding: 14px 16px;
      width: 250px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      font-size: 13px;
      z-index: 200;
    }

    .tooltip-header {
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }

    .book-list {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #cbd5e1;
      font-size: 11px;
      color: var(--text-muted);
    }

    .book-list ul {
      margin: 4px 0 0 0;
      padding-left: 14px;
      color: #334155;
    }

    .axis-line {
      stroke: var(--axis-color);
      stroke-width: 2.5;
    }

    .midline {
      stroke: #94a3b8;
      stroke-dasharray: 5, 5;
      stroke-width: 1.5;
    }

    .axis-label {
      font-size: 12.5px;
      font-weight: 700;
      fill: #475569;
    }

    .animal-stack {
      transition: opacity 0.2s ease;
    }

    .animal-stack:hover {
      opacity: 0.75;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Bears Will Be Boys: Animal Gender Scale</h1>
    <p class="subtitle">
      Horizontal scale: Male (0% Female) to Female (100% Female)[cite: 2]. Stack height indicates total books recorded ($n$)[cite: 2].
    </p>
    <div class="toolbar">
      <div class="controls-group">
        <button class="btn" id="btn-zoom-in">＋ Zoom In</button>
        <button class="btn" id="btn-zoom-out">－ Zoom Out</button>
        <button class="btn" id="btn-zoom-reset">Reset</button>
        <span class="zoom-level-badge" id="visible-count-badge">Showing 19 animals (n &ge; 10)</span>
      </div>
      <div class="zoom-instruction">🔍 Scroll / pinch to zoom in &amp; discover smaller-sample animals</div>
    </div>
  </header>

  <div id="chart-wrapper">
    <svg id="chart"></svg>
    <div id="tooltip" class="tooltip"></div>
  </div>
</div>

<script>
const animalIcons = {
  bear: '🐻', rabbit: '🐰', cat: '🐱', mouse: '🐭', pig: '🐷',
  dog: '🐶', bird: '🐦', dinosaur: '🦖', elephant: '🐘', fox: '🦊',
  monkey: '🐵', frog: '🐸', spider: '🕷️', lion: '🦁', duck: '🦆',
  fish: '🐟', owl: '🦉', goat: '🐐', wolf: '🐺', reindeer: '🦌',
  llama: '🦙', toad: '🐸', aardvark: '🐾', goose: '🪿', worm: '🪱',
  fly: '🪰', penguin: '🐧', badger: '🦡', hippo: '🦛', donkey: '🫏',
  crab: '🦀', rhino: '🦏', horse: '🐴', snake: '🐍', tiger: '🐯',
  raccoon: '🦝', crow: '🐦‍⬛', moose: '🫎', skunk: '🦨', ladybug: '🐞',
  kangaroo: '🦘', turtle: '🐢', ox: '🐂', sheep: '🐑', bat: '🦇',
  cricket: '🦗', deer: '🦌', hedgehog: '🦔', butterfly: '🦋', chameleon: '🦎',
  rat: '🐀', whale: '🐋', mole: '🦔', opossum: '🦝', chicken: '🐔',
  squirrel: '🐿️', bug: '🐛', pony: '🐴', firefly: '🪲', eagle: '🦅',
  seal: '🦭', cobra: '🐍', chipmunk: '🐿️', beaver: '🦫', giraffe: '🦒',
  'praying mantis': '🦗', hyena: '🐺', camel: '🐫', gorilla: '🦍', crocodile: '🐊',
  alligator: '🐊', caterpillar: '🐛', tortoise: '🐢', 'stink bug': '🪲', hog: '🐗',
  'walking stick': '🦗', newt: '🦎', iguana: '🦎', jaguar: '🐆', octopus: '🐙',
  lizard: '🦎', meerkat: '🦡', baboon: '🐒', leopard: '🐆', 'boa constrictor': '🐍',
  chimpanzee: '🐒', koala: '🐨', ape: '🦍', narwhal: '🐋', bee: '🐝',
  mink: '🦦', flamingo: '🦩', orangutan: '🦧', woodchuck: '🦫', lemming: '🐹',
  mosquito: '🦟', lobster: '🦞', warthog: '🐗', clam: '🦪', jellyfish: '🪼',
  squid: '🦑', grasshopper: '🦗', 'luna moth': '🦋', porcupine: '🦔', otter: '🦦',
  snail: '🐌', armadillo: '🦔', ostrich: '🦤', muskrat: '🐀', eel: '🐍',
  dolphin: '🐬', inchworm: '🐛', wolverine: '🦡', mongoose: '🦦', turkey: '🦃',
  swan: '🦢', 'yellow jacket': '🐝', 'stag beetle': '🪲', sloth: '🦥'
};

const evenFive = new Set(["bird", "duck", "cat", "mouse", "pig"]);

const containerEl = document.getElementById("chart-wrapper");
const width = 1140;
const height = 540;
const margin = { top: 50, right: 70, bottom: 95, left: 70 };
const innerWidth = width - margin.left - margin.right;
const innerHeight = height - margin.top - margin.bottom;

const svg = d3.select("#chart")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .attr("width", "100%")
  .attr("height", height);

// Clip path so zooming elements don't spill outside chart margins
svg.append("defs").append("clipPath")
  .attr("id", "chart-clip")
  .append("rect")
  .attr("x", 0)
  .attr("y", -margin.top)
  .attr("width", innerWidth)
  .attr("height", innerHeight + margin.top + margin.bottom);

const mainG = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const zoomableG = mainG.append("g")
  .attr("clip-path", "url(#chart-clip)");

const stacksG = zoomableG.append("g").attr("class", "stacks-group");
const tooltip = d3.select("#tooltip");

d3.csv("kids-book-animals.csv").then(rawData => {
  const grouped = d3.rollup(
    rawData,
    records => {
      const total = records.length;
      const male = records.filter(r => r.pronoun === "he/him").length;
      const female = records.filter(r => r.pronoun === "she/her").length;
      const neutral = records.filter(r => r.pronoun === "it").length;
      const pctMale = (male / total) * 100;
      const pctFemale = (female / total) * 100;
      const titles = [...new Set(records.map(r => r.title))].slice(0, 3);
      return { total, male, female, neutral, pctMale, pctFemale, titles };
    },
    d => d.animal_group
  );

  const dataset = Array.from(grouped, ([animal, meta]) => ({
    animal,
    ...meta
  })).sort((a, b) => a.pctFemale - b.pctFemale);

  const baseScale = d3.scaleLinear().domain([0, 100]).range([0, innerWidth]);

  // Baseline axis
  mainG.append("line")
    .attr("class", "axis-line")
    .attr("x1", 0).attr("x2", innerWidth)
    .attr("y1", innerHeight).attr("y2", innerHeight);

  // Labels
  mainG.append("text").attr("class", "axis-label")
    .attr("x", 0).attr("y", innerHeight + 46)
    .text("← 100% He/Him (Male)");

  mainG.append("text").attr("class", "axis-label")
    .attr("x", innerWidth).attr("y", innerHeight + 46)
    .attr("text-anchor", "end")
    .text("100% She/Her (Female) →");

  // Midline group
  const midlineG = zoomableG.append("g").attr("class", "midline-g");
  midlineG.append("line")
    .attr("class", "midline")
    .attr("y1", -20).attr("y2", innerHeight);

  midlineG.append("text")
    .attr("class", "axis-label")
    .attr("y", innerHeight + 46)
    .attr("text-anchor", "middle")
    .text("50/50 Balanced");

  // Create element nodes for each animal
  const animalNodes = stacksG.selectAll(".animal-stack")
    .data(dataset, d => d.animal)
    .enter()
    .append("g")
    .attr("class", "animal-stack")
    .attr("cursor", "pointer");

  animalNodes.each(function(d) {
    const g = d3.select(this);
    const icon = animalIcons[d.animal] || "🐾";
    const isEven = evenFive.has(d.animal);

    const step = 18;
    const stackCount = d.total <= 8 ? d.total : Math.min(20, 8 + Math.round((d.total - 8) / 4.5));
    const stackTopY = innerHeight - (stackCount * step) - 10;

    // Invisible transparent overlay box to capture hover/mouse events across the stack
    g.append("rect")
      .attr("x", -18)
      .attr("y", stackTopY - 14)
      .attr("width", 36)
      .attr("height", innerHeight - (stackTopY - 14))
      .attr("fill", "transparent");

    // Pure stacked icons (no oval border)
    for (let i = 0; i < stackCount; i++) {
      g.append("text")
        .attr("x", 0)
        .attr("y", innerHeight - 8 - (i * step))
        .attr("text-anchor", "middle")
        .attr("font-size", "16px")
        .text(icon);
    }

    // Top n frequency badge
    g.append("text")
      .attr("x", 0)
      .attr("y", stackTopY - 6)
      .attr("text-anchor", "middle")
      .attr("font-size", "10.5px")
      .attr("font-weight", "800")
      .attr("fill", isEven ? "#b45309" : "#475569")
      .text(`n=${d.total}`);

    // Diagonal animal name label (angled -45 degrees)
    g.append("text")
      .attr("x", 0)
      .attr("y", innerHeight + 16)
      .attr("text-anchor", "end")
      .attr("transform", `rotate(-45, 0, ${innerHeight + 16})`)
      .attr("font-size", "11px")
      .attr("font-weight", isEven ? "800" : "600")
      .attr("fill", isEven ? "#b45309" : "#1e293b")
      .text(d.animal.toUpperCase());
  });

  // Tooltip bindings
  animalNodes.on("mouseover", (event, d) => {
    tooltip.style("visibility", "visible")
      .html(`
        <div class="tooltip-header">
          <span>${d.animal}</span>
          <span>${animalIcons[d.animal] || "🐾"}</span>
        </div>
        <div class="stat-row"><span>Total Books (n):</span> <strong>${d.total}</strong></div>
        <div class="stat-row"><span>Male (He/Him):</span> <strong>${d.male} (${d.pctMale.toFixed(1)}%)</strong></div>
        <div class="stat-row"><span>Female (She/Her):</span> <strong>${d.female} (${d.pctFemale.toFixed(1)}%)</strong></div>
        ${d.neutral > 0 ? `<div class="stat-row"><span>Neutral (It):</span> <strong>${d.neutral}</strong></div>` : ''}
        <div class="book-list">
          <strong>Sample Titles:</strong>
          <ul>${d.titles.map(t => `<li>${t}</li>`).join("")}</ul>
        </div>
      `);
  })
  .on("mousemove", (event) => {
    const containerRect = containerEl.getBoundingClientRect();
    const leftPos = event.clientX - containerRect.left + 15;
    const topPos = event.clientY - containerRect.top - 70;
    tooltip.style("top", `${Math.max(10, topPos)}px`).style("left", `${leftPos}px`);
  })
  .on("mouseout", () => tooltip.style("visibility", "hidden"));

  // Zoom handling logic
  const zoom = d3.zoom()
    .scaleExtent([1, 8])
    .translateExtent([[0, 0], [innerWidth, innerHeight]])
    .on("zoom", (event) => {
      const transform = event.transform;
      const newXScale = transform.rescaleX(baseScale);

      // Reposition 50/50 midline
      const midX = newXScale(50);
      midlineG.attr("transform", `translate(${midX}, 0)`);

      // Determine visibility threshold based on zoom level k
      let minN = 10;
      if (transform.k >= 4.0) minN = 1;
      else if (transform.k >= 2.6) minN = 2;
      else if (transform.k >= 1.6) minN = 5;

      let visibleCount = 0;

      animalNodes.each(function(d) {
        const node = d3.select(this);
        const isVisible = d.total >= minN;
        const posX = newXScale(d.pctFemale);

        node.attr("transform", `translate(${posX}, 0)`);

        if (isVisible && posX >= -40 && posX <= innerWidth + 40) {
          node.style("display", "block").style("opacity", 1);
          visibleCount++;
        } else {
          node.style("display", "none").style("opacity", 0);
        }
      });

      d3.select("#visible-count-badge").text(
        `Zoom ${transform.k.toFixed(1)}×: Showing ${visibleCount} animals (n ≥ ${minN})`
      );
    });

  svg.call(zoom);

  // Zoom Button Controls
  d3.select("#btn-zoom-in").on("click", () => {
    svg.transition().duration(400).call(zoom.scaleBy, 1.4);
  });

  d3.select("#btn-zoom-out").on("click", () => {
    svg.transition().duration(400).call(zoom.scaleBy, 0.7);
  });

  d3.select("#btn-zoom-reset").on("click", () => {
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
  });

  // Initial render at 1x
  svg.call(zoom.transform, d3.zoomIdentity);
});
</script>
</body>
</html>
