<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bears Will Be Boys: Animal Gender Scale</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --bar-bg: #e2e8f0;
      --bar-male: #93c5fd;
      --bar-female: #f472b6;
      --accent-even: #fef3c7;
      --accent-even-border: #f59e0b;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      color: #334155;
      transition: all 0.15s ease;
    }

    .filter-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    #chart-wrapper {
      position: relative;
      margin-top: 16px;
    }

    svg {
      display: block;
      margin: 0 auto;
      overflow: visible;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      visibility: hidden;
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 8px;
      padding: 14px 16px;
      width: 250px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      font-size: 13px;
      z-index: 100;
    }

    .tooltip-header {
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }

    .book-list {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #cbd5e1;
      font-size: 11px;
      color: var(--text-muted);
    }

    .book-list ul {
      margin: 4px 0 0 0;
      padding-left: 14px;
      color: #334155;
    }

    .axis-line {
      stroke: #0f172a;
      stroke-width: 2;
    }

    .midline {
      stroke: #94a3b8;
      stroke-dasharray: 4, 4;
      stroke-width: 1.5;
    }

    .axis-label {
      font-size: 12px;
      font-weight: 700;
      fill: #475569;
    }

    .y-grid line {
      stroke: #f1f5f9;
      stroke-width: 1;
    }

    .y-grid text {
      font-size: 10px;
      fill: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Bears Will Be Boys: Animal Gender Scale</h1>
    <p class="subtitle">
      Horizontal position marks pronoun proportion from predominantly male (left) to female (right).
      Stack height signifies total book count (frequency).
    </p>
    <div class="toolbar">
      <div class="button-group">
        <button class="filter-btn active" id="btn-prominent">Prominent Animals (n &ge; 10)</button>
        <button class="filter-btn" id="btn-all">All Animals</button>
      </div>
      <span style="font-size: 13px; color: var(--text-muted);">Hover any column for titles &amp; ratios</span>
    </div>
  </header>

  <div id="chart-wrapper">
    <svg id="chart"></svg>
    <div id="tooltip" class="tooltip"></div>
  </div>
</div>

<script>
const margin = { top: 40, right: 50, bottom: 90, left: 60 };
const width = 1100 - margin.left - margin.right;
const height = 480 - margin.top - margin.bottom;

const svg = d3.select("#chart")
  .attr("width", width + margin.left + margin.right)
  .attr("height", height + margin.top + margin.bottom)
  .append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const tooltip = d3.select("#tooltip");

const animalIcons = {
  bear: "🐻", rabbit: "🐰", cat: "🐱", mouse: "🐭", pig: "🐷",
  dog: "🐶", bird: "🐦", duck: "🦆", dinosaur: "🦖", elephant: "🐘",
  fox: "🦊", monkey: "🐵", frog: "🐸", spider: "🕷️", lion: "🦁",
  fish: "🐟", owl: "🦉", goat: "🐐", wolf: "🐺"
};

// Animals highlighting the closer-to-even split
const evenFive = new Set(["bird", "duck", "cat", "mouse", "pig"]);

d3.csv("kids-book-animals.csv").then(rawData => {
  const grouped = d3.rollup(
    rawData,
    records => {
      const total = records.length;
      const male = records.filter(r => r.pronoun === "he/him").length;
      const female = records.filter(r => r.pronoun === "she/her").length;
      const neutral = records.filter(r => r.pronoun === "it").length;
      const pctMale = (male / total) * 100;
      const pctFemale = (female / total) * 100;
      const titles = [...new Set(records.map(r => r.title))].slice(0, 3);
      return { total, male, female, neutral, pctMale, pctFemale, titles };
    },
    d => d.animal_group
  );

  const dataset = Array.from(grouped, ([animal, meta]) => ({
    animal,
    ...meta
  })).sort((a, b) => a.pctFemale - b.pctFemale);

  const xScale = d3.scaleLinear().domain([0, 100]).range([0, width]);
  const yScale = d3.scaleLinear().domain([0, 100]).range([height, 0]);

  // Y-axis gridlines
  const yAxis = d3.axisLeft(yScale).ticks(5).tickSize(-width).tickFormat(d => `${d} bks`);
  svg.append("g")
    .attr("class", "y-grid")
    .call(yAxis)
    .call(g => g.select(".domain").remove());

  // Baseline axis
  svg.append("line")
    .attr("class", "axis-line")
    .attr("x1", 0).attr("x2", width)
    .attr("y1", height).attr("y2", height);

  // 50/50 equality midline
  svg.append("line")
    .attr("class", "midline")
    .attr("x1", xScale(50)).attr("x2", xScale(50))
    .attr("y1", 0).attr("y2", height);

  // Axis Labels
  svg.append("text").attr("class", "axis-label")
    .attr("x", 0).attr("y", height + 70)
    .text("← 100% He/Him (Male)");

  svg.append("text").attr("class", "axis-label")
    .attr("x", xScale(50)).attr("y", height + 70)
    .attr("text-anchor", "middle")
    .text("50/50 Balanced");

  svg.append("text").attr("class", "axis-label")
    .attr("x", width).attr("y", height + 70)
    .attr("text-anchor", "end")
    .text("100% She/Her (Female) →");

  const stackContainer = svg.append("g").attr("class", "stacks");

  function render(showProminentOnly = true) {
    const data = showProminentOnly
      ? dataset.filter(d => d.total >= 10)
      : dataset;

    const columnWidth = Math.max(14, Math.min(28, width / (data.length * 1.5)));

    const stacks = stackContainer.selectAll(".animal-stack")
      .data(data, d => d.animal);

    stacks.exit().remove();

    const enter = stacks.enter().append("g")
      .attr("class", "animal-stack")
      .attr("cursor", "pointer");

    const merged = enter.merge(stacks)
      .attr("transform", d => `translate(${xScale(d.pctFemale)}, 0)`);

    merged.selectAll("*").remove();

    merged.each(function(d) {
      const g = d3.select(this);
      const icon = animalIcons[d.animal] || "🐾";
      const isEven = evenFive.has(d.animal);
      const barH = height - yScale(d.total);

      // Stack pillar background
      g.append("rect")
        .attr("x", -columnWidth / 2)
        .attr("y", yScale(d.total))
        .attr("width", columnWidth)
        .attr("height", barH)
        .attr("rx", 6)
        .attr("fill", isEven ? "rgba(245, 158, 11, 0.18)" : "rgba(148, 163, 184, 0.18)")
        .attr("stroke", isEven ? "#f59e0b" : "#94a3b8")
        .attr("stroke-width", isEven ? 1.8 : 1);

      // Top Animal Icon Badge
      g.append("text")
        .attr("x", 0)
        .attr("y", yScale(d.total) - 8)
        .attr("text-anchor", "middle")
        .attr("font-size", columnWidth > 18 ? "18px" : "14px")
        .text(icon);

      // Angled bottom label to prevent text overlaps
      g.append("text")
        .attr("x", 0)
        .attr("y", height + 14)
        .attr("text-anchor", "end")
        .attr("transform", `rotate(-50, 0, ${height + 14})`)
        .attr("font-size", "11px")
        .attr("font-weight", isEven ? "800" : "600")
        .attr("fill", isEven ? "#b45309" : "#334155")
        .text(d.animal.toUpperCase());
    });

    // Tooltip event bindings
    merged.on("mouseover", (event, d) => {
      d3.select(event.currentTarget).select("rect").attr("fill", "#fbbf24");
      tooltip.style("visibility", "visible")
        .html(`
          <div class="tooltip-header">
            <span>${d.animal}</span>
            <span>${animalIcons[d.animal] || "🐾"}</span>
          </div>
          <div class="stat-row"><span>Total Books (n):</span> <strong>${d.total}</strong></div>
          <div class="stat-row"><span>Male (He/Him):</span> <strong>${d.male} (${d.pctMale.toFixed(1)}%)</strong></div>
          <div class="stat-row"><span>Female (She/Her):</span> <strong>${d.female} (${d.pctFemale.toFixed(1)}%)</strong></div>
          ${d.neutral > 0 ? `<div class="stat-row"><span>Neutral (It):</span> <strong>${d.neutral}</strong></div>` : ''}
          <div class="book-list">
            <strong>Sample Titles:</strong>
            <ul>${d.titles.map(t => `<li>${t}</li>`).join("")}</ul>
          </div>
        `);
    })
    .on("mousemove", (event) => {
      tooltip
        .style("top", `${event.pageY - 120}px`)
        .style("left", `${event.pageX + 18}px`);
    })
    .on("mouseout", (event, d) => {
      const isEven = evenFive.has(d.animal);
      d3.select(event.currentTarget).select("rect")
        .attr("fill", isEven ? "rgba(245, 158, 11, 0.18)" : "rgba(148, 163, 184, 0.18)");
      tooltip.style("visibility", "hidden");
    });
  }

  render(true);

  d3.select("#btn-prominent").on("click", function() {
    d3.selectAll(".filter-btn").classed("active", false);
    d3.select(this).classed("active", true);
    render(true);
  });

  d3.select("#btn-all").on("click", function() {
    d3.selectAll(".filter-btn").classed("active", false);
    d3.select(this).classed("active", true);
    render(false);
  });
});
</script>
</body>
</html>
