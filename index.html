<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bears Will Be Boys: Animal Gender Scale</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --axis-color: #1e293b;
      --even-border: #f59e0b;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    header {
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      color: #334155;
      transition: all 0.15s ease;
    }

    .filter-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .scroll-hint {
      font-size: 12.5px;
      color: #b45309;
      background: #fef3c7;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Horizontally scrollable chart viewport */
    #chart-scroll-container {
      position: relative;
      margin-top: 20px;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: #ffffff;
      scrollbar-width: thin;
      scrollbar-color: #94a3b8 #f1f5f9;
    }

    #chart-scroll-container::-webkit-scrollbar {
      height: 10px;
    }
    #chart-scroll-container::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    #chart-scroll-container::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 5px;
    }

    svg {
      display: block;
      overflow: visible;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      visibility: hidden;
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 8px;
      padding: 14px 16px;
      width: 250px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      font-size: 13px;
      z-index: 200;
    }

    .tooltip-header {
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }

    .book-list {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #cbd5e1;
      font-size: 11px;
      color: var(--text-muted);
    }

    .book-list ul {
      margin: 4px 0 0 0;
      padding-left: 14px;
      color: #334155;
    }

    .axis-line {
      stroke: var(--axis-color);
      stroke-width: 2.5;
    }

    .midline {
      stroke: #94a3b8;
      stroke-dasharray: 5, 5;
      stroke-width: 1.5;
    }

    .axis-label {
      font-size: 12.5px;
      font-weight: 700;
      fill: #475569;
    }

    .animal-stack {
      transition: opacity 0.2s ease;
    }

    .animal-stack:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Bears Will Be Boys: Animal Gender Scale</h1>
    <p class="subtitle">
      Horizontal position represents pronoun progression from 100% He/Him (Male) to 100% She/Her (Female).
      Stack height indicates total books recorded ($n$).
    </p>
    <div class="toolbar">
      <div class="button-group">
        <!-- "All Animals" is active by default -->
        <button class="filter-btn active" id="btn-all">All Animals</button>
        <button class="filter-btn" id="btn-prominent">Prominent Animals (n &ge; 10)</button>
      </div>
      <div class="scroll-hint">⇄ Scroll horizontally to explore all animals</div>
    </div>
  </header>

  <div id="chart-scroll-container">
    <svg id="chart"></svg>
    <div id="tooltip" class="tooltip"></div>
  </div>
</div>

<script>
// Icon dictionary mapping all 119 animals in the dataset
const animalIcons = {
  bear: '🐻', rabbit: '🐰', cat: '🐱', mouse: '🐭', pig: '🐷',
  dog: '🐶', bird: '🐦', dinosaur: '🦖', elephant: '🐘', fox: '🦊',
  monkey: '🐵', frog: '🐸', spider: '🕷️', lion: '🦁', duck: '🦆',
  fish: '🐟', owl: '🦉', goat: '🐐', wolf: '🐺', reindeer: '🦌',
  llama: '🦙', toad: '🐸', aardvark: '🐾', goose: '🪿', worm: '🪱',
  fly: '🪰', penguin: '🐧', badger: '🦡', hippo: '🦛', donkey: '🫏',
  crab: '🦀', rhino: '🦏', horse: '🐴', snake: '🐍', tiger: '🐯',
  raccoon: '🦝', crow: '🐦‍⬛', moose: '🫎', skunk: '🦨', ladybug: '🐞',
  kangaroo: '🦘', turtle: '🐢', ox: '🐂', sheep: '🐑', bat: '🦇',
  cricket: '🦗', deer: '🦌', hedgehog: '🦔', butterfly: '🦋', chameleon: '🦎',
  rat: '🐀', whale: '🐋', mole: '🦔', opossum: '🦝', chicken: '🐔',
  squirrel: '🐿️', bug: '🐛', pony: '🐴', firefly: '🪲', eagle: '🦅',
  seal: '🦭', cobra: '🐍', chipmunk: '🐿️', beaver: '🦫', giraffe: '🦒',
  'praying mantis': '🦗', hyena: '🐺', camel: '🐫', gorilla: '🦍', crocodile: '🐊',
  alligator: '🐊', caterpillar: '🐛', tortoise: '🐢', 'stink bug': '🪲', hog: '🐗',
  'walking stick': '🦗', newt: '🦎', iguana: '🦎', jaguar: '🐆', octopus: '🐙',
  lizard: '🦎', meerkat: '🦡', baboon: '🐒', leopard: '🐆', 'boa constrictor': '🐍',
  chimpanzee: '🐒', koala: '🐨', ape: '🦍', narwhal: '🐋', bee: '🐝',
  mink: '🦦', flamingo: '🦩', orangutan: '🦧', woodchuck: '🦫', lemming: '🐹',
  mosquito: '🦟', lobster: '🦞', warthog: '🐗', clam: '🦪', jellyfish: '🪼',
  squid: '🦑', grasshopper: '🦗', 'luna moth': '🦋', porcupine: '🦔', otter: '🦦',
  snail: '🐌', armadillo: '🦔', ostrich: '🦤', muskrat: '🐀', eel: '🐍',
  dolphin: '🐬', inchworm: '🐛', wolverine: '🦡', mongoose: '🦦', turkey: '🦃',
  swan: '🦢', 'yellow jacket': '🐝', 'stag beetle': '🪲', sloth: '🦥'
};

const evenFive = new Set(["bird", "duck", "cat", "mouse", "pig"]);

d3.csv("kids-book-animals.csv").then(rawData => {
  const grouped = d3.rollup(
    rawData,
    records => {
      const total = records.length;
      const male = records.filter(r => r.pronoun === "he/him").length;
      const female = records.filter(r => r.pronoun === "she/her").length;
      const neutral = records.filter(r => r.pronoun === "it").length;
      const pctMale = (male / total) * 100;
      const pctFemale = (female / total) * 100;
      const titles = [...new Set(records.map(r => r.title))].slice(0, 3);
      return { total, male, female, neutral, pctMale, pctFemale, titles };
    },
    d => d.animal_group
  );

  const dataset = Array.from(grouped, ([animal, meta]) => ({
    animal,
    ...meta
  })).sort((a, b) => a.pctFemale - b.pctFemale);

  const tooltip = d3.select("#tooltip");

  // Dynamic separation to handle dense animal placement
  function separateX(data, innerWidth, minDistance = 42) {
    const xScale = d3.scaleLinear().domain([0, 100]).range([0, innerWidth]);
    const positions = data.map(d => ({
      origX: xScale(d.pctFemale),
      x: xScale(d.pctFemale),
      data: d
    }));

    for (let iter = 0; iter < 150; iter++) {
      let moved = false;
      for (let i = 0; i < positions.length - 1; i++) {
        const cur = positions[i];
        const next = positions[i + 1];
        const diff = next.x - cur.x;
        if (diff < minDistance) {
          const shift = (minDistance - diff) / 2;
          cur.x = Math.max(0, cur.x - shift);
          next.x = Math.min(innerWidth, next.x + shift);
          moved = true;
        }
      }
      if (!moved) break;
    }
    return { positions, xScale };
  }

  function render(showAll = true) {
    const data = showAll
      ? dataset
      : dataset.filter(d => d.total >= 10);

    // Dynamic width: wider canvas for all 119 animals, narrower for prominent
    const chartWidth = showAll ? 5200 : 2200;
    const chartHeight = 580;
    const margin = { top: 60, right: 120, bottom: 95, left: 120 };

    const innerWidth = chartWidth - margin.left - margin.right;
    const innerHeight = chartHeight - margin.top - margin.bottom;

    const svg = d3.select("#chart");
    svg.selectAll("*").remove(); // Clear previous drawing

    svg.attr("width", chartWidth).attr("height", chartHeight);

    const mainG = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const { positions, xScale } = separateX(data, innerWidth, showAll ? 42 : 56);

    // Baseline axis
    mainG.append("line")
      .attr("class", "axis-line")
      .attr("x1", 0).attr("x2", innerWidth)
      .attr("y1", innerHeight).attr("y2", innerHeight);

    // 50/50 midline
    mainG.append("line")
      .attr("class", "midline")
      .attr("x1", xScale(50)).attr("x2", xScale(50))
      .attr("y1", -20).attr("y2", innerHeight);

    // Scale end labels
    mainG.append("text").attr("class", "axis-label")
      .attr("x", 0).attr("y", innerHeight + 46)
      .text("← 100% He/Him (Male)");

    mainG.append("text").attr("class", "axis-label")
      .attr("x", xScale(50)).attr("y", innerHeight + 46)
      .attr("text-anchor", "middle")
      .text("50/50 Balanced");

    mainG.append("text").attr("class", "axis-label")
      .attr("x", innerWidth).attr("y", innerHeight + 46)
      .attr("text-anchor", "end")
      .text("100% She/Her (Female) →");

    // Percentage ticks along baseline
    for (let p = 0; p <= 100; p += 10) {
      mainG.append("line")
        .attr("x1", xScale(p)).attr("x2", xScale(p))
        .attr("y1", innerHeight).attr("y2", innerHeight + 8)
        .attr("stroke", "#94a3b8")
        .attr("stroke-width", 1.5);

      mainG.append("text")
        .attr("x", xScale(p))
        .attr("y", innerHeight + 22)
        .attr("text-anchor", "middle")
        .attr("font-size", "10px")
        .attr("fill", "#94a3b8")
        .text(p + "%");
    }

    const stackContainer = mainG.append("g").attr("class", "stacks");

    const stacks = stackContainer.selectAll(".animal-stack")
      .data(positions, d => d.data.animal)
      .enter()
      .append("g")
      .attr("class", "animal-stack")
      .attr("cursor", "pointer")
      .attr("transform", d => `translate(${d.x}, 0)`);

    stacks.each(function(pos) {
      const g = d3.select(this);
      const d = pos.data;
      const icon = animalIcons[d.animal] || "🐾";
      const isEven = evenFive.has(d.animal);

      const step = 18;
      // Stacking logic: 1 icon per book for small counts; scales logarithmically/proportionally for huge stacks
      const stackCount = d.total <= 8 
        ? d.total 
        : Math.min(22, 8 + Math.round((d.total - 8) / 4.5));

      const stackTopY = innerHeight - (stackCount * step) - 10;
      const deltaX = pos.origX - pos.x;

      // Leader tick line linking stack to exact pronoun % on baseline
      g.append("line")
        .attr("x1", 0).attr("y1", innerHeight)
        .attr("x2", deltaX).attr("y2", innerHeight + 6)
        .attr("stroke", isEven ? "#f59e0b" : "#cbd5e1")
        .attr("stroke-width", 1.5)
        .attr("stroke-dasharray", Math.abs(deltaX) > 2 ? "2,2" : "none");

      // Stack container bracket pill
      const colW = 34;
      g.append("rect")
        .attr("x", -colW / 2)
        .attr("y", stackTopY - 12)
        .attr("width", colW)
        .attr("height", innerHeight - (stackTopY - 12))
        .attr("rx", 17)
        .attr("fill", isEven ? "rgba(254, 243, 199, 0.55)" : "rgba(241, 245, 249, 0.45)")
        .attr("stroke", isEven ? "#f59e0b" : "#e2e8f0")
        .attr("stroke-width", isEven ? 2 : 1);

      // Vertically stacked animal icons
      for (let i = 0; i < stackCount; i++) {
        g.append("text")
          .attr("x", 0)
          .attr("y", innerHeight - 10 - (i * step))
          .attr("text-anchor", "middle")
          .attr("font-size", "15px")
          .text(icon);
      }

      // Sample count badge above stack
      g.append("text")
        .attr("x", 0)
        .attr("y", stackTopY - 18)
        .attr("text-anchor", "middle")
        .attr("font-size", "11px")
        .attr("font-weight", "800")
        .attr("fill", isEven ? "#b45309" : "#475569")
        .text(`n=${d.total}`);

      // Diagonal animal name label (angled -45 degrees)
      g.append("text")
        .attr("x", 0)
        .attr("y", innerHeight + 20)
        .attr("text-anchor", "end")
        .attr("transform", `rotate(-45, 0, ${innerHeight + 20})`)
        .attr("font-size", "11px")
        .attr("font-weight", isEven ? "800" : "600")
        .attr("fill", isEven ? "#b45309" : "#1e293b")
        .text(d.animal.toUpperCase());
    });

    // Tooltip hover bindings
    stacks.on("mouseover", (event, pos) => {
      const d = pos.data;
      tooltip.style("visibility", "visible")
        .html(`
          <div class="tooltip-header">
            <span>${d.animal}</span>
            <span>${animalIcons[d.animal] || "🐾"}</span>
          </div>
          <div class="stat-row"><span>Total Books (n):</span> <strong>${d.total}</strong></div>
          <div class="stat-row"><span>Male (He/Him):</span> <strong>${d.male} (${d.pctMale.toFixed(1)}%)</strong></div>
          <div class="stat-row"><span>Female (She/Her):</span> <strong>${d.female} (${d.pctFemale.toFixed(1)}%)</strong></div>
          ${d.neutral > 0 ? `<div class="stat-row"><span>Neutral (It):</span> <strong>${d.neutral}</strong></div>` : ''}
          <div class="book-list">
            <strong>Sample Titles:</strong>
            <ul>${d.titles.map(t => `<li>${t}</li>`).join("")}</ul>
          </div>
        `);
    })
    .on("mousemove", (event) => {
      const containerRect = document.getElementById("chart-scroll-container").getBoundingClientRect();
      const leftPos = event.clientX - containerRect.left + 15;
      const topPos = event.clientY - containerRect.top - 70;

      tooltip
        .style("top", `${Math.max(10, topPos)}px`)
        .style("left", `${leftPos}px`);
    })
    .on("mouseout", () => {
      tooltip.style("visibility", "hidden");
    });
  }

  // DEFAULT VIEW: All Animals
  render(true);

  // Button filter click triggers
  d3.select("#btn-all").on("click", function() {
    d3.selectAll(".filter-btn").classed("active", false);
    d3.select(this).classed("active", true);
    render(true);
  });

  d3.select("#btn-prominent").on("click", function() {
    d3.selectAll(".filter-btn").classed("active", false);
    d3.select(this).classed("active", true);
    render(false);
  });
});
</script>
</body>
</html>
